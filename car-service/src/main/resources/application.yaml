spring:
  application:
    name: car-service
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:cardb
    username: user
    password:
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
      path: /h2-console